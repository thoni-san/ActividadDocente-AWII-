        <div class="flex flex-col items-center text-center">
            <a href="#">
                <img class="w-auto h-7" [src]="logoUrl" alt="logo" />
            </a>

            <div class="flex flex-wrap justify-center mt-6 -mx-4">
                @for (enlace of enlaces; track enlace.nombre) {
                <a href="#"
                    class="mx-4 text-sm text-gray-600 transition-colors duration-300 hover:text-blue-500 dark:text-gray-300 dark:hover:text-blue-400"
                    aria-label="Reddit">
                    {{enlace.nombre}}
                </a>
                }
            </div>
        </div>

        <hr class="my-6 border-gray-200 md:my-10 dark:border-gray-700" />
